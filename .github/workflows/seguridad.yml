name: Seguridad y build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # todo el historial, no solo el último commit
      - name: Instalar gitleaks
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks
      - name: Escanear historial
        run: ./gitleaks git . --redact --verbose --exit-code 1

  app:
    name: Lint, tipos, auditoría y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brillo-sur
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brillo-sur/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Pruebas unitarias (validación de pedidos y WhatsApp)
        run: npm test
      - name: Auditoría de dependencias de producción
        run: npm run audit:prod
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  db:
    name: Pruebas de RLS (Postgres + pgTAP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Preparar Postgres 16 con pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16-pgtap
          sudo systemctl start postgresql
      - name: Ejecutar pruebas
        run: |
          cp -r brillo-sur /tmp/brillo-sur && sudo chown -R postgres /tmp/brillo-sur
          sudo -u postgres bash /tmp/brillo-sur/scripts/test-db.sh
